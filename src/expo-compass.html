<title>Europe Expo Compass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: exhibition-hall wayfinding — a filter rail on the left, the fair list as hall signs with amber date badges; detail slides in from the right. */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --sunken:#E8EBE6; --ink:#17201D; --muted:#5B6863; --line:#D5DAD3;
  --sign:#DCE8F7; --sign-ink:#1B4F8C; --dot:#2E6DB4; --teal:#1C6A60; --teal-soft:#DCEDE9; --ok:#2E7A4C; --warn:#B0560B; --warn-soft:#FBEBDD;
  --f-display:"Barlow Condensed","Arial Narrow","Noto Sans SC",sans-serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111715; --surface:#19211F; --sunken:#0D1311; --ink:#E6ECE8; --muted:#97A49F; --line:#2B3532;
  --sign:#1B2E47; --sign-ink:#9CC3F0; --dot:#9CC3F0; --teal:#63C4B5; --teal-soft:#1D3531; --ok:#6CC08B; --warn:#F0A060; --warn-soft:#3A2A1C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715; --surface:#19211F; --sunken:#0D1311; --ink:#E6ECE8; --muted:#97A49F; --line:#2B3532;
  --sign:#1B2E47; --sign-ink:#9CC3F0; --dot:#9CC3F0; --teal:#63C4B5; --teal-soft:#1D3531; --ok:#6CC08B; --warn:#F0A060; --warn-soft:#3A2A1C; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55}
a{color:var(--teal)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-bottom:16px;border-bottom:2px solid var(--ink)}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:40px;line-height:1;letter-spacing:.01em;margin:0;text-wrap:balance}
.brand p{margin:6px 0 0;color:var(--muted);font-size:13px}
.stats{display:flex;gap:20px;font-variant-numeric:tabular-nums}
.hright{display:grid;justify-items:end;gap:10px}
.langbtn{border:1px solid var(--ink);background:transparent;border-radius:999px;padding:3px 12px;cursor:pointer;font-size:12.5px;font-weight:500}
.langbtn:hover{background:var(--ink);color:var(--surface)}
.stat b{display:block;font-family:var(--f-display);font-size:28px;line-height:1;font-weight:600}
.stat small{color:var(--muted);font-size:12px}

main{margin-top:18px}

/* filter bar: one row of dropdowns, quick toggles at the end, active filters underneath */
.fbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dd{position:relative}
.ddbtn{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:6px 10px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.ddbtn:hover{border-color:var(--muted)}
.ddbtn[aria-expanded="true"]{border-color:var(--ink)}
.ddbtn.on{border-color:var(--ink);font-weight:500}
.ddbtn .n{font-family:var(--f-mono);font-size:11px;background:var(--ink);color:var(--surface);border-radius:2px;padding:0 5px}
.ddbtn .car{font-size:10px;color:var(--muted)}
.ddpanel{position:absolute;top:calc(100% + 6px);left:0;z-index:10;min-width:230px;max-width:calc(100vw - 32px);max-height:380px;overflow:auto;background:var(--surface);border:1px solid var(--ink);border-radius:6px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.ddpanel.right{left:auto;right:0}
.ddpanel .hint{font-size:12px;color:var(--muted);padding:4px 8px 6px}
.opt{display:flex;align-items:center;gap:9px;width:100%;border:0;background:transparent;border-radius:3px;padding:6px 8px;cursor:pointer;text-align:left}
.opt:hover:not(:disabled){background:var(--sunken)}
.opt:disabled{color:var(--muted);opacity:.5;cursor:default}
.opt .box{width:14px;height:14px;border:1.5px solid var(--muted);border-radius:2px;flex:none}
.opt[aria-checked="true"] .box{background:var(--ink);border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--surface)}
.opt.hl[aria-checked="true"] .box{background:var(--teal);border-color:var(--teal)}
.opt .lbl{flex:1}
.opt .cnt{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.sep{width:1px;align-self:stretch;background:var(--line);margin:2px 4px}
.qt{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 11px;cursor:pointer;font-size:12.5px;white-space:nowrap}
.qt:hover{border-color:var(--muted)}
.qt[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--surface)}
.active{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;min-height:0}
.active:empty{display:none}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;background:var(--sunken);border-radius:3px;padding:2px 4px 2px 8px}
.pill small{color:var(--muted)}
.pill button{border:0;background:transparent;cursor:pointer;padding:0 4px;font-size:13px;line-height:1;color:var(--muted)}
.pill button:hover{color:var(--ink)}
.clear{background:none;border:0;padding:0 4px;color:var(--teal);cursor:pointer;font-size:12.5px;text-decoration:underline}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.search{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:7px 10px}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:4px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button+button{border-left:1px solid var(--line)}
.count{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}

/* list */
.month{margin:22px 0 8px;display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:4px}
.month:first-child{margin-top:0}
.month h2{font-family:var(--f-display);font-weight:600;font-size:22px;margin:0;letter-spacing:.02em}
.month span{color:var(--muted);font-size:12px}
.fair{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:14px;align-items:start;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-top:8px;cursor:pointer}
.fair:hover{border-color:var(--muted)}
.fair.dim{opacity:.55}
.badge{background:var(--sign);color:var(--sign-ink);border-radius:3px;text-align:center;padding:5px 2px 6px;font-family:var(--f-display);line-height:1}
.badge .m{font-size:13px;font-weight:600;letter-spacing:.1em}
.badge .d{font-size:24px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.badge.past{background:var(--sunken);color:var(--muted)}
.fair .name{font-weight:700;font-size:15px;line-height:1.35}
.fair .where{color:var(--muted);font-size:12.5px;margin-top:2px}
.cc{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:2px;padding:0 4px;margin-right:6px;color:var(--ink)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.tag{font-size:11.5px;background:var(--sunken);border-radius:2px;padding:1px 6px;color:var(--ink)}
.tag.job{background:var(--teal-soft);color:var(--teal)}
.side{display:grid;justify-items:end;gap:6px;text-align:right}
.scale{font-family:var(--f-display);font-size:14px;font-weight:600;letter-spacing:.06em;white-space:nowrap}
.scale i{font-style:normal;color:var(--dot)}
.warnpill{font-size:11px;color:var(--warn);background:var(--warn-soft);border-radius:2px;padding:1px 6px;white-space:nowrap}
.scale.est{opacity:.55}
.dlpill{font-size:11px;color:var(--teal);border:1px dashed var(--teal);border-radius:2px;padding:0 6px;white-space:nowrap}
.cancel .name{text-decoration:line-through}
.prev{margin-top:8px;padding:8px 10px;border-left:3px solid var(--line);font-size:12.5px;color:var(--muted);white-space:pre-wrap}
.prev b{color:var(--ink);font-weight:500}
.mine{font-size:11.5px;border:1px solid var(--teal);color:var(--teal);border-radius:2px;padding:0 6px;white-space:nowrap}
.mine.strong{background:var(--teal);color:var(--surface)}
.togo{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
@media (max-width:560px){.fair{grid-template-columns:64px minmax(0,1fr)}.side{grid-column:2;justify-items:start;text-align:left;display:flex;flex-wrap:wrap;gap:6px}.badge .d{font-size:20px}}

/* timeline */
.tl{overflow-x:auto;border:1px solid var(--line);background:var(--surface);border-radius:6px}
.tl-in{min-width:820px;position:relative;padding:0 12px 12px}
.tl-head{display:grid;grid-template-columns:210px 1fr;position:sticky;top:0;background:var(--surface);z-index:2;border-bottom:1px solid var(--line)}
.tl-months{position:relative;height:34px}
.tl-months span{position:absolute;top:10px;font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.04em;padding-left:4px;border-left:1px solid var(--line);height:24px}
.tl-row{display:grid;grid-template-columns:210px 1fr;align-items:center;min-height:30px;cursor:pointer}
.tl-row:hover .tl-label{color:var(--teal)}
.tl-label{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:10px}
.tl-track{position:relative;height:30px}
.tl-grid{position:absolute;top:0;bottom:0;border-left:1px solid var(--line)}
.tl-bar{position:absolute;top:9px;height:12px;border-radius:2px;background:var(--muted);min-width:5px}
.tl-bar.job{background:var(--teal)}
.tl-bar.go{background:var(--dot)}
.tl-today{position:absolute;top:0;bottom:0;border-left:2px dashed var(--warn);z-index:1}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin:10px 2px 0}
.legend i{display:inline-block;width:18px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.empty{border:1px dashed var(--line);border-radius:6px;padding:28px;text-align:center;color:var(--muted)}

/* detail drawer */
.scrim{position:fixed;inset:0;background:rgba(10,14,12,.35);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);border-left:2px solid var(--ink);z-index:21;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 18px) 20px calc(env(safe-area-inset-bottom,0px) + 28px)}
.drawer .x{float:right;border:1px solid var(--line);background:transparent;border-radius:4px;padding:2px 10px;cursor:pointer}
.drawer h2{font-family:var(--f-display);font-size:30px;line-height:1.05;margin:4px 0 6px;font-weight:700;text-wrap:balance}
.drawer .when{font-family:var(--f-mono);font-size:13px}
.drawer .hl{margin:14px 0;padding:10px 12px;background:var(--sunken);border-radius:4px}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:14px 0;font-size:13px}
.facts dt{color:var(--muted)}
.facts dd{margin:0}
.sec{margin-top:20px}
.sec h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:500}
.stbtns{display:flex;flex-wrap:wrap;gap:6px}
.stbtns button{border:1px solid var(--line);background:transparent;border-radius:3px;padding:4px 10px;cursor:pointer}
.stbtns button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--surface)}
textarea{width:100%;min-height:120px;border:1px solid var(--line);background:var(--bg);border-radius:4px;padding:8px;resize:vertical}
.saved{font-size:12px;color:var(--muted);margin-top:4px;min-height:18px}
.links{display:flex;flex-wrap:wrap;gap:8px}
.btnlink{display:inline-block;border:1px solid var(--ink);border-radius:4px;padding:5px 12px;text-decoration:none;color:var(--ink)}
.btnlink.primary{background:var(--ink);color:var(--surface)}
.verify{font-size:12.5px;color:var(--muted)}
.verify b{color:var(--ok);font-weight:500}
.verify b.w{color:var(--warn)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:4px;z-index:30;font-size:13px}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Europe Expo Compass</h1>
      <p><span data-i18n="subtitle">欧洲 B2B 展会与会议</span> · <span id="cov"></span> · <span id="upd"></span></p>
    </div>
    <div class="hright">
      <button class="langbtn" id="lang" type="button"></button>
      <div class="stats" id="stats"></div>
    </div>
  </header>

  <main>
      <div class="toolbar">
        <input id="q" class="search" type="search" data-i18n-ph="searchPh" data-i18n-aria="search">
        <div class="seg" role="group" data-i18n-aria="rangeAria" id="range">
          <button data-r="3" data-i18n="r3"></button><button data-r="6" data-i18n="r6"></button><button data-r="12" data-i18n="r12"></button><button data-r="all" data-i18n="rall"></button>
        </div>
        <div class="seg" role="group" data-i18n-aria="viewAria">
          <button id="v-list" aria-pressed="true" data-i18n="vList"></button>
          <button id="v-tl" aria-pressed="false" data-i18n="vTimeline"></button>
        </div>
        <span class="count" id="rcount"></span>
        <span id="exports" hidden style="display:inline-flex;gap:6px;flex-wrap:wrap">
          <button class="qt" id="ex-go" data-i18n="exGo" data-i18n-title="exGoTip"></button>
          <button class="qt" id="ex-list" data-i18n="exList" data-i18n-title="exListTip"></button>
          <button class="qt" id="ex-backup" data-i18n="exBackup" data-i18n-title="exBackupTip"></button>
        </span>
      </div>
      <div style="margin-bottom:16px">
        <div class="fbar" id="fbar"></div>
        <div class="active" id="active"></div>
      </div>
      <div id="out"><div class="empty" data-i18n="loading"></div></div>
  </main>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden data-i18n-aria="detailAria"></aside>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- language ---------- */
// UI text in both languages. Catalogue text comes from each fair (Chinese) and its `en` block (English).
const MONTH_EN=['January','February','March','April','May','June','July','August','September','October','November','December'];
const MON_EN=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const MON3=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const T={
  zh:{
    subtitle:'欧洲 B2B 展会与会议',countries:n=>`${n} 国`,updated:d=>`目录更新于 ${d}`,updatedUnknown:'目录更新日期未知',
    langBtn:'EN',langAria:'Switch to English',
    searchPh:'搜索展会、城市、公司…',search:'搜索',rangeAria:'时间范围',r3:'3 个月',r6:'6 个月',r12:'12 个月',rall:'全部',
    viewAria:'视图',vList:'列表',vTimeline:'时间轴',
    exGo:'导出日历：要去 / 已报名',exGoTip:'把标了「要去」或「已报名」、还没结束的展会导出成一个 .ics 文件',

    exBackup:'导出备份',exBackupTip:'把展会目录、你的状态和笔记、Highlight 设置导出成一个 JSON 文件',

    IND:{tech:'科技·AI·数据',telecom:'电信·网络',finance:'金融·金融科技',energy:'能源·气候',industry:'制造·工业',logistics:'物流·航运',health:'医疗·生命科学',food:'食品·农业',build:'建筑·地产',auto:'汽车·出行',fashion:'时尚·纺织',sport:'体育·户外',maritime:'海事·游艇',retail:'零售·电商',policy:'政策·国际组织',media:'文旅·媒体·教育'},
    TYPE:{trade:'贸易展',conf:'会议·峰会',expoconf:'展+会'},
    SCALE_DEF:{flagship:'Flagship：行业全球级标杆，展商 1,000+ 或观众 50,000+',large:'Large：展商 300–1,000 或观众 10,000–50,000',medium:'Medium：展商 100–300 或观众 5,000–10,000',boutique:'Boutique：人数少，但讲者和参会者层级高'},

    STATUS:{interested:'感兴趣',going:'要去',registered:'已报名',attended:'已去过',skip:'不去'},PRIO:{high:'高',mid:'中',low:'低'},
    WD:['周日','周一','周二','周三','周四','周五','周六'],

    monthName:(y,m)=>`${y} 年 ${m} 月`,nFairs:n=>`${n} 场`,tlMonth:m=>`${m}月`,
    gCountry:'国家',gMonth:'月份',gInd:'行业',gType:'类型',gScale:'规模',
    qJob:'Only highlight',qVerified:'只看已核实',qMine:'只看我标过的',qPast:'显示已结束',
    noMonths:'当前时间范围内没有可选的月份',hlHint:'勾选的行业会在列表里高亮',remove:x=>`去掉 ${x}`,clear:'清空筛选',
    statUpcoming:'场即将举办',statVerified:'官网已核实',statGoing:'要去 / 已报名',
    estimated:'。这一场官网没给数字，档位是按行业地位估计的',aggregatorOnly:'仅见于聚合站',deadlinePill:(m,d)=>`${m}/${d} 截止`,
    legendGoing:'要去 / 已报名',legendHL:'Highlight 行业',legendOther:'其它',today:'今天',
    showing:(a,b)=>`显示 ${a} / ${b} 场`,
    needLogin:'这个页面需要登录 claude.ai 才能读取展会数据。',noServer:'连不上本地程序。请关掉这个窗口，重新双击「Start Expo Compass.bat」。',

    fInd:'行业',fType:'类型',fScale:'规模',fAud:'观众',fCycle:'举办周期',fExh:'展商',fVis:'参会人数',fTicket:'门票',fDeadlines:'截止日期',fFree:'免费入场',yes:'有',fLang:'语言',fCompanies:'代表公司',
    scaleEstimated:'（官网没给数字，按行业地位估计）',verified:'✓ 已在官网核实',aggregatorWarn:'⚠ 仅见于聚合站，出发前再去官网确认',source:'来源 ↗',
    secStatus:'我的状态',secPrio:'优先级',secNotes:'Networking 笔记',notesPh:'想见哪些公司或人、想问什么、会后跟进…',
    prevNotes:(name,y)=>`${name}（${y}）的笔记`,
    nextHint:c=>`这一届已经结束，目录里还没有下一届（${c}）。每月刷新时会去官网查下一届的日期。`,

const LANGS=['zh','en'];
function initialLang(){
  try{const v=localStorage.getItem('er.lang');if(LANGS.includes(v))return v}catch(e){}
  return /^zh\b/i.test(navigator.language||'')?'zh':'en';  // first visit: follow the browser
}
let lang=initialLang();
const t=(k,...a)=>{const v=T[lang][k];return typeof v==='function'?v(...a):v};
const IND=()=>T[lang].IND;
// catalogue text in the current language: the fair's `en` block in English, the main fields in Chinese
const L=(f,k)=>lang==='en'&&f.en&&f.en[k]!=null?f.en[k]:f[k];

const HL_DEFAULT=['tech','finance','energy'];
let HL=new Set(HL_DEFAULT);
const isHL=f=>(f.industries||[]).some(i=>HL.has(i));
const COUNTRY={NL:'Netherlands',BE:'Belgium',DE:'Germany',FR:'France',GB:'United Kingdom',ES:'Spain',IT:'Italy',CH:'Switzerland',AT:'Austria',DK:'Denmark',SE:'Sweden',FI:'Finland'};
const SCALE={flagship:'Flagship',large:'Large',medium:'Medium',boutique:'Boutique'};
const SCALE_DOTS={flagship:'●●●',large:'●●○',medium:'●○○',boutique:'◆'};
const RANGES=['3','6','12','all'];

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=(()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())})();
const dayDiff=(a,b)=>Math.round((b-a)/864e5);
const ymd=d=>`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const ym=d=>iso(d).slice(0,7);
const addMonths=(d,n)=>new Date(d.getFullYear(),d.getMonth()+n,d.getDate());
// calendar arithmetic, not +24h: a day across the October/March clock change is 23 or 25 hours
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const upcoming=f=>pd(f.end)>=today;
const going=p=>p&&(p.status==='going'||p.status==='registered');

let fairs=[], plans={}, meta=null, db=null, loaded=false, fairsLoaded=false;
const DEF={countries:[],months:[],inds:[],types:[],scales:[],job:false,verified:false,mine:false,past:false,range:'6'};
let F=load('er.filters',DEF), view=load('er.view','list'), q='', openId=null;
function load(k,d){
  try{const v=localStorage.getItem(k);if(!v)return typeof d==='object'?JSON.parse(JSON.stringify(d)):d;
    const p=JSON.parse(v);return typeof d==='object'?{...JSON.parse(JSON.stringify(d)),...p}:p}
  catch(e){return typeof d==='object'?JSON.parse(JSON.stringify(d)):d}
}
function store(k,v){try{localStorage.setItem(k,typeof v==='string'?v:JSON.stringify(v))}catch(e){}}

/* Saved settings can point at options that no longer exist (a past month, a renamed industry).
   Drop anything unknown so an old choice never filters the list down to nothing. */
function sanitize(){
  const keep=(arr,ok)=>Array.isArray(arr)?arr.filter(v=>ok.includes(v)):[];
  F.countries=keep(F.countries,Object.keys(COUNTRY));
  F.inds=keep(F.inds,Object.keys(IND()));
  F.types=keep(F.types,Object.keys(T.zh.TYPE));
  F.scales=keep(F.scales,Object.keys(SCALE));
  if(fairsLoaded)F.months=keep(F.months,monthList());
  if(!RANGES.includes(String(F.range)))F.range='6';
  ['job','verified','mine','past'].forEach(k=>F[k]=!!F[k]);
  store('er.filters',F);
}
function sanitizeHL(list){return new Set((Array.isArray(list)?list:HL_DEFAULT).filter(k=>k in T.zh.IND))}

function toast(s){const el=$('#toast');el.textContent=s;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2600)}

// static text in the page markup (data-i18n*), set again on every language switch
function applyStatic(){
  document.documentElement.lang=lang==='zh'?'zh-CN':'en';
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>el.placeholder=t(el.dataset.i18nPh));
  document.querySelectorAll('[data-i18n-aria]').forEach(el=>el.setAttribute('aria-label',t(el.dataset.i18nAria)));
  document.querySelectorAll('[data-i18n-title]').forEach(el=>el.title=t(el.dataset.i18nTitle));
  const b=$('#lang');b.textContent=t('langBtn');b.setAttribute('aria-label',t('langAria'));b.title=t('langAria');
}
function setLang(next,save){
  if(!LANGS.includes(next)||next===lang)return;
  lang=next;store('er.lang',lang);
  applyStatic();renderHeader();renderFilters();renderMain();
  if(openId)openDetail(openId);
  if(save)savePrefs();
}
$('#lang').onclick=()=>setLang(lang==='zh'?'en':'zh',true);

function dateLabel(f){const s=pd(f.start),e=pd(f.end);return t('dateLabel',s,e,dayDiff(s,e)+1)}
function badge(f){
  const s=pd(f.start),e=pd(f.end),past=e<today;
  const d=f.start===f.end?`${s.getDate()}`:`${s.getDate()}–${e.getDate()}`;
  const m=s.getMonth()===e.getMonth()?MON_EN[s.getMonth()]:`${MON_EN[s.getMonth()]}/${MON_EN[e.getMonth()]}`;
  return `<div class="badge${past?' past':''}"><div class="m">${m}</div><div class="d">${d}</div></div>`;
}
function togo(f){
  const s=pd(f.start),e=pd(f.end);
  if(e<today)return t('ended');
  if(s<=today)return t('onNow');
  return t('inDays',dayDiff(today,s));
}
function monthsOf(f){const out=[];for(let d=new Date(pd(f.start).getFullYear(),pd(f.start).getMonth(),1);d<=pd(f.end);d=new Date(d.getFullYear(),d.getMonth()+1,1))out.push(ym(d));return out}
function inRange(f,r){if(r==='all')return true;return pd(f.start)<=addMonths(today,Number(r))}
// months offered in the filter: every month that has a fair the other basic rules can show
function monthList(){
  const set=new Set();fairs.forEach(f=>{if((F.past||upcoming(f))&&inRange(f,F.range))monthsOf(f).forEach(m=>set.add(m))});
  return [...set].sort();
}
// deadlines still ahead, with their label in the current language
const upcomingDeadlines=f=>(f.deadlines||[]).map((x,i)=>({date:x.date,label:lang==='en'&&f.en&&f.en.deadlines?f.en.deadlines[i]:x.label}))
  .filter(x=>pd(x.date)>=today).sort((a,b)=>a.date.localeCompare(b.date));

// search finds a fair by its Chinese and English text, whichever language is shown
function haystack(f){
  const e=f.en||{};
  return [f.name,e.name,f.city,f.venue,e.venue,COUNTRY[f.country],f.series,f.highlight,e.highlight,(f.companies||[]).join(' '),
    (f.industries||[]).map(i=>T.zh.IND[i]+' '+T.en.IND[i]).join(' ')].join(' ').toLowerCase();
}
function match(f,X=F){
  const p=plans[f.id];
  if(!X.past&&!upcoming(f))return false;
  if(!inRange(f,X.range))return false;
  if(X.countries.length&&!X.countries.includes(f.country))return false;
  if(X.months.length&&!monthsOf(f).some(m=>X.months.includes(m)))return false;
  if(X.inds.length&&!(f.industries||[]).some(i=>X.inds.includes(i)))return false;
  if(X.types.length&&!X.types.includes(f.type))return false;
  if(X.scales.length&&!X.scales.includes(f.scale))return false;
  if(X.job&&!isHL(f))return false;
  if(X.verified&&f.verify!=='official')return false;
  if(X.mine&&!(p&&p.status&&p.status!=='skip'))return false;
  if(q&&!haystack(f).includes(q))return false;
  return true;
}

const QUICK=[['job','qJob'],['verified','qVerified'],['mine','qMine'],['past','qPast']];
let openDD=null;
function groups(){
  const mo={};monthList().forEach(m=>{const [y,mm]=m.split('-');mo[m]=t('monthName',y,+mm)});
  return [['countries',t('gCountry'),COUNTRY],['months',t('gMonth'),mo],['inds',t('gInd'),IND()],['types',t('gType'),T[lang].TYPE],['scales',t('gScale'),SCALE]];
}
// how many fairs this option would show, given every other active filter
function optCount(k,v){const X={...F,[k]:[v]};return fairs.filter(f=>match(f,X)).length}

function renderFilters(){
  const G=groups();
  const dd=G.map(([k,title,opts])=>{
    const n=F[k].length, open=openDD===k;
    const entries=Object.entries(opts);
    const panel=open?`<div class="ddpanel" role="menu">${entries.length?entries.map(([v,l])=>{
        const on=F[k].includes(v), c=optCount(k,v);
        return `<button class="opt" role="menuitemcheckbox" data-k="${k}" data-v="${esc(v)}" aria-checked="${on}" ${k==='scales'?`title="${esc(t('SCALE_DEF')[v])}"`:''} ${!on&&!c?'disabled':''}><span class="box"></span><span class="lbl">${esc(l)}</span><span class="cnt">${c}</span></button>`}).join(''):`<div class="hint">${esc(t('noMonths'))}</div>`}</div>`:'';
    return `<div class="dd"><button class="ddbtn${n?' on':''}" data-dd="${k}" aria-expanded="${open}">${esc(title)}${n?`<span class="n">${n}</span>`:''}<span class="car">▾</span></button>${panel}</div>`;
  }).join('');
  const hlOpen=openDD==='hl';
  const hlPanel=hlOpen?`<div class="ddpanel" role="menu"><div class="hint">${esc(t('hlHint'))}</div>${Object.entries(IND()).map(([k,l])=>
      `<button class="opt hl" role="menuitemcheckbox" data-hl="${k}" aria-checked="${HL.has(k)}"><span class="box"></span><span class="lbl">${esc(l)}</span></button>`).join('')}</div>`:'';
  const hlBtn=`<div class="dd"><button class="ddbtn" data-dd="hl" aria-expanded="${hlOpen}">Highlight<span class="n" style="background:var(--teal)">${HL.size}</span><span class="car">▾</span></button>${hlPanel}</div>`;
  const quick=QUICK.map(([k,l])=>`<button class="qt" data-q="${k}" aria-pressed="${!!F[k]}">${esc(t(l))}</button>`).join('');
  $('#fbar').innerHTML=dd+hlBtn+'<span class="sep"></span>'+quick;
  const p=document.querySelector('.ddpanel');
  if(p&&p.getBoundingClientRect().right>window.innerWidth-8)p.classList.add('right');

  const pills=[];
  G.forEach(([k,title,opts])=>F[k].forEach(v=>pills.push(`<span class="pill"><small>${esc(title)}</small>${esc(opts[v]||v)}<button data-rm="${k}" data-v="${esc(v)}" aria-label="${esc(t('remove',opts[v]||v))}">×</button></span>`)));
  QUICK.forEach(([k,l])=>{if(F[k]&&k!=='past')pills.push(`<span class="pill">${esc(t(l))}<button data-rm="${k}" aria-label="${esc(t('remove',t(l)))}">×</button></span>`)});
  $('#active').innerHTML=pills.length?pills.join('')+`<button class="clear" id="clear">${esc(t('clear'))}</button>`:'';
  document.querySelectorAll('#range [data-r]').forEach(b=>b.setAttribute('aria-pressed',String(F.range)===b.dataset.r));
}
$('#fbar').addEventListener('click',e=>{
  const b=e.target.closest('[data-dd]');
  if(b){openDD=openDD===b.dataset.dd?null:b.dataset.dd;renderFilters();return}
  const o=e.target.closest('.opt[data-k]');
  if(o){const k=o.dataset.k,v=o.dataset.v;F[k]=F[k].includes(v)?F[k].filter(x=>x!==v):[...F[k],v];changed();return}
  const h=e.target.closest('.opt[data-hl]');
  if(h){const next=new Set(HL);next.has(h.dataset.hl)?next.delete(h.dataset.hl):next.add(h.dataset.hl);HL=next;renderFilters();renderMain();savePrefs();return}
  const tq=e.target.closest('[data-q]');
  if(tq){F[tq.dataset.q]=!F[tq.dataset.q];changed()}
});
$('#active').addEventListener('click',e=>{
  const r=e.target.closest('[data-rm]');
  if(r){const k=r.dataset.rm;Array.isArray(F[k])?F[k]=F[k].filter(x=>x!==r.dataset.v):F[k]=false;changed();return}
  if(e.target.id==='clear'){F={...JSON.parse(JSON.stringify(DEF)),range:F.range};changed()}
});
$('#range').addEventListener('click',e=>{const b=e.target.closest('[data-r]');if(b){F.range=b.dataset.r;changed()}});
document.addEventListener('click',e=>{if(openDD&&!e.target.closest('.dd')){openDD=null;renderFilters()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&openDD){openDD=null;renderFilters()}});
// Highlight industries and the language live together in settings/prefs
let prefsQueue=Promise.resolve();
function savePrefs(){
  if(!db){toast(t('noDbSave'));return}
  const body={highlight:Object.keys(T.zh.IND).filter(k=>HL.has(k)),lang,schemaVersion:1,updatedAt:new Date().toISOString()};
  prefsQueue=prefsQueue.then(()=>db.doc('settings/prefs').set(body)).catch(()=>toast(t('hlSaveFail')));
}
function changed(){sanitize();renderFilters();renderMain()}

$('#q').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();renderMain()});
$('#v-list').onclick=()=>{view='list';store('er.view',view);renderMain()};
$('#v-tl').onclick=()=>{view='timeline';store('er.view',view);renderMain()};

function renderHeader(){
  const cc=new Set(fairs.map(f=>f.country));
  $('#cov').textContent=t('countries',cc.size||12);
  $('#upd').textContent=meta&&meta.updatedAt?t('updated',meta.updatedAt):t('updatedUnknown');
  const up=fairs.filter(upcoming);
  const g=fairs.filter(f=>upcoming(f)&&going(plans[f.id])).length;
  $('#stats').innerHTML=`
    <div class="stat"><b>${up.length}</b><small>${esc(t('statUpcoming'))}</small></div>
    <div class="stat"><b>${fairs.filter(f=>f.verify==='official').length}/${fairs.length}</b><small>${esc(t('statVerified'))}</small></div>
    <div class="stat"><b>${g}</b><small>${esc(t('statGoing'))}</small></div>`;
}

function scaleTag(f){
  const est=f.scaleBasis==='reputation';
  const tip=(t('SCALE_DEF')[f.scale]||'')+(est?t('estimated'):'');
  return `<span class="scale${est?' est':''}" title="${esc(tip)}" style="cursor:help"><i>${SCALE_DOTS[f.scale]||''}</i> ${esc(SCALE[f.scale]||'')}</span>`;
}
function fairCard(f){
  const p=plans[f.id]||{};
  const inds=(f.industries||[]).map(i=>`<span class="tag${HL.has(i)?' job':''}">${esc(IND()[i]||i)}</span>`).join('');
  const st=p.status?`<span class="mine${going(p)?' strong':''}">${esc(t('STATUS')[p.status])}</span>`:'';
  const ev=t('EVSTATUS')[f.eventStatus]?`<span class="warnpill">${esc(t('EVSTATUS')[f.eventStatus])}</span>`:'';
  const dl=upcomingDeadlines(f).filter(x=>dayDiff(today,pd(x.date))<=30).map(x=>`<span class="dlpill" title="${esc(x.label)}">${esc(t('deadlinePill',+x.date.slice(5,7),+x.date.slice(8)))}</span>`).join('');
  return `<button class="fair${p.status==='skip'?' dim':''}${f.eventStatus==='cancelled'?' cancel':''}" data-id="${esc(f.id)}">
    ${badge(f)}
    <div style="min-width:0">
      <div class="name">${esc(L(f,'name'))}</div>
      <div class="where"><span class="cc">${esc(f.country)}</span>${esc(f.city)} · ${esc(L(f,'venue'))}</div>
      <div class="tags">${inds}<span class="tag">${esc(t('TYPE')[f.type]||'')}</span></div>
    </div>
    <div class="side">
      ${scaleTag(f)}
      ${ev}
      ${f.verify!=='official'?`<span class="warnpill">${esc(t('aggregatorOnly'))}</span>`:''}
      ${dl}
      ${st}
      <span class="togo">${esc(togo(f))}</span>
    </div>
  </button>`;
}

// a fair that runs across two months is listed under both (only the selected ones, if any)
function renderList(list){
  const groups={};
  list.forEach(f=>monthsOf(f).forEach(k=>{if(F.months.length&&!F.months.includes(k))return;(groups[k]=groups[k]||[]).push(f)}));
  return Object.keys(groups).sort().map(k=>{const [y,m]=k.split('-');
    return `<div class="month"><h2>${esc(t('monthName',y,+m))}</h2><span>${esc(t('nFairs',groups[k].length))}</span></div>`+groups[k].map(fairCard).join('')}).join('');
}

function renderTimeline(list){
  const first=list.reduce((m,f)=>pd(f.start)<m?pd(f.start):m,today);
  const last=list.reduce((m,f)=>pd(f.end)>m?pd(f.end):m,today);
  const a=new Date(first.getFullYear(),first.getMonth(),1), b=new Date(last.getFullYear(),last.getMonth()+1,1), span=b-a;
  const X=d=>Math.max(0,Math.min(100,(d-a)/span*100));
  const months=[];for(let d=new Date(a);d<b;d=new Date(d.getFullYear(),d.getMonth()+1,1))months.push(new Date(d));
  const head=months.map((d,i)=>`<span style="left:${X(d)}%">${i===0||d.getMonth()===0?d.getFullYear()+' · ':''}${esc(t('tlMonth',d.getMonth()+1))}</span>`).join('');
  const grid=months.map(d=>`<div class="tl-grid" style="left:${X(d)}%"></div>`).join('');
  const tdy=today>=a&&today<b?`<div class="tl-today" style="left:${X(today)}%" title="${esc(t('today'))}"></div>`:'';
  const rows=list.map(f=>{const go=going(plans[f.id]);
    const l=X(pd(f.start)),w=Math.max(.5,X(addDays(pd(f.end),1))-l);
    return `<div class="tl-row" data-id="${esc(f.id)}" title="${esc(L(f,'name'))} · ${esc(dateLabel(f))}"><div class="tl-label"><span class="cc">${esc(f.country)}</span>${esc(L(f,'name'))}</div><div class="tl-track">${grid}${tdy}<div class="tl-bar${go?' go':isHL(f)?' job':''}" style="left:${l}%;width:${w}%"></div></div></div>`}).join('');
  const minw=Math.max(820,210+months.length*90);
  return `<div class="tl"><div class="tl-in" style="min-width:${minw}px"><div class="tl-head"><div></div><div class="tl-months">${head}</div></div>${rows}</div></div>
    <div class="legend"><span><i style="background:var(--dot)"></i>${esc(t('legendGoing'))}</span><span><i style="background:var(--teal)"></i>${esc(t('legendHL'))}</span><span><i style="background:var(--muted)"></i>${esc(t('legendOther'))}</span><span><i style="border-left:2px dashed var(--warn);width:0;height:12px"></i>${esc(t('today'))}</span></div>`;
}

function renderMain(){
  $('#v-list').setAttribute('aria-pressed',view==='list');$('#v-tl').setAttribute('aria-pressed',view==='timeline');
  if(!db){$('#out').innerHTML=`<div class="empty">${esc(loaded?t(window.EXPO_LOCAL?'noServer':'needLogin'):t('loading'))}</div>`;return}
  if(!fairs.length){$('#out').innerHTML=`<div class="empty">${esc(loaded&&fairsLoaded?t('emptyCatalog'):t('loading'))}</div>`;$('#rcount').textContent='';return}
  const list=fairs.filter(f=>match(f)).sort((x,y)=>x.start.localeCompare(y.start)||x.name.localeCompare(y.name));
  $('#rcount').textContent=t('showing',list.length,fairs.length);
  if(!list.length){$('#out').innerHTML=`<div class="empty">${esc(t('noMatch'))}</div>`;return}
  $('#out').innerHTML=view==='list'?renderList(list):renderTimeline(list);
}
$('#out').addEventListener('click',e=>{const el=e.target.closest('[data-id]');if(el)openDetail(el.dataset.id)});

/* ---------- detail ---------- */
function calLinks(f){
  const s=pd(f.start),e=addDays(pd(f.end),1);
  const loc=`${L(f,'venue')}, ${f.city}`, det=`${t('officialLabel')}${f.url}`;
  const g=`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(L(f,'name'))}&dates=${ymd(s)}/${ymd(e)}&location=${encodeURIComponent(loc)}&details=${encodeURIComponent(det)}`;
  return `<a class="btnlink" href="${g}" target="_blank" rel="noopener">${esc(t('addGoogle'))}</a>`;
}
// notes written for other editions of the same fair (e.g. last year's MEDICA)
function otherEditions(f){
  return fairs.filter(x=>x.series===f.series&&x.id!==f.id).sort((a,b)=>a.start.localeCompare(b.start));
}
function openDetail(id){
  const f=fairs.find(x=>x.id===id);if(!f)return;openId=id;
  const p=plans[id]||{};
  const t_=document.activeElement&&document.activeElement.id==='notes'?$('#notes').value:null;  // keep text being typed across a language switch
  const fact=(k,v)=>v?`<dt>${esc(t(k))}</dt><dd>${esc(v)}</dd>`:'';
  const dls=upcomingDeadlines(f).map(x=>`${x.label}${t('colon')}${x.date}`).join(t('sepClause'));
  const others=otherEditions(f);
  const prevNotes=others.filter(x=>(plans[x.id]||{}).notes).map(x=>`<div class="prev"><b>${esc(t('prevNotes',L(x,'name'),x.start.slice(0,4)))}</b>\n${esc(plans[x.id].notes)}</div>`).join('');
  const nextHint=!upcoming(f)&&!others.some(x=>x.start>f.start)?`<div class="hl">${esc(t('nextHint',t('CYCLE')[f.cycle]||''))}</div>`:'';
  const ev=t('EVSTATUS')[f.eventStatus];
  $('#drawer').innerHTML=`
    <button class="x" id="x">${esc(t('close'))}</button>
    <div class="where" style="color:var(--muted);font-size:12.5px"><span class="cc">${esc(f.country)}</span>${esc(COUNTRY[f.country])} · ${esc(f.city)}</div>
    <h2>${esc(L(f,'name'))}</h2>
    <div class="when">${esc(dateLabel(f))} · ${esc(togo(f))}${ev?` · <b style="color:var(--warn)">${esc(ev)}</b>`:''}</div>
    <div class="when" style="color:var(--muted);margin-top:2px">${esc(L(f,'venue'))}</div>
    ${nextHint}
    ${L(f,'highlight')?`<div class="hl">${esc(L(f,'highlight'))}</div>`:''}
    <div class="links"><a class="btnlink primary" href="${esc(f.url)}" target="_blank" rel="noopener">${esc(t('officialSite'))}</a>${calLinks(f)}</div>
    <dl class="facts">
      ${fact('fInd',(f.industries||[]).map(i=>IND()[i]).join(t('sepList')))}
      ${fact('fType',t('TYPE')[f.type])}${fact('fScale',(t('SCALE_DEF')[f.scale]||'')+(f.scaleBasis==='reputation'?t('scaleEstimated'):''))}${fact('fAud',t('AUD')[f.audience])}
      ${fact('fCycle',t('CYCLE')[f.cycle])}
      ${fact('fExh',L(f,'exhibitors'))}${fact('fVis',L(f,'visitors'))}${fact('fTicket',L(f,'ticket'))}
      ${fact('fDeadlines',dls)}
      ${f.freePass===true?fact('fFree',t('yes')):''}${fact('fLang',L(f,'language'))}
      ${fact('fCompanies',(f.companies||[]).join(t('sepList')))}
    </dl>
    <div class="verify">${f.verify==='official'?`<b>${esc(t('verified'))}</b>`:`<b class="w">${esc(t('aggregatorWarn'))}</b>`} · ${esc(f.verifiedAt)} · <a href="${esc(f.sourceUrl)}" target="_blank" rel="noopener">${esc(t('source'))}</a></div>
    <div class="sec"><h3>${esc(t('secStatus'))}</h3><div class="stbtns" id="st">${Object.entries(t('STATUS')).map(([k,l])=>`<button data-st="${k}" aria-pressed="${p.status===k}">${esc(l)}</button>`).join('')}</div></div>
    <div class="sec"><h3>${esc(t('secPrio'))}</h3><div class="stbtns" id="pr">${Object.entries(t('PRIO')).map(([k,l])=>`<button data-pr="${k}" aria-pressed="${p.priority===k}">${esc(l)}</button>`).join('')}</div></div>
    <div class="sec"><h3>${esc(t('secNotes'))}</h3><textarea id="notes" placeholder="${esc(t('notesPh'))}">${esc(t_!==null?t_:(p.notes||''))}</textarea><div class="saved" id="saved"></div>${prevNotes}</div>`;
  $('#drawer').hidden=false;$('#scrim').hidden=false;
  if(t_!==null)$('#notes').focus();else $('#x').focus();
}
function closeDetail(){flushNotes();openId=null;$('#drawer').hidden=true;$('#scrim').hidden=true}
$('#scrim').onclick=closeDetail;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&openId)closeDetail()});
$('#drawer').addEventListener('click',e=>{
  if(e.target.id==='x')return closeDetail();
  const s=e.target.closest('[data-st]'),r=e.target.closest('[data-pr]');
  if(s){const cur=(plans[openId]||{}).status;savePlan(openId,{status:cur===s.dataset.st?null:s.dataset.st});refreshButtons()}
  if(r){const cur=(plans[openId]||{}).priority;savePlan(openId,{priority:cur===r.dataset.pr?null:r.dataset.pr});refreshButtons()}
});
let notesTimer=null;
$('#drawer').addEventListener('input',e=>{if(e.target.id==='notes'){$('#saved').textContent=t('typing');clearTimeout(notesTimer);notesTimer=setTimeout(flushNotes,900)}});
$('#drawer').addEventListener('focusout',e=>{if(e.target.id==='notes')flushNotes()});
function flushNotes(){clearTimeout(notesTimer);const n=$('#notes');if(!n||!openId)return;if(n.value!==((plans[openId]||{}).notes||''))savePlan(openId,{notes:n.value},true)}
function refreshButtons(){
  if(!openId)return;const p=plans[openId]||{};
  document.querySelectorAll('#st [data-st]').forEach(b=>b.setAttribute('aria-pressed',p.status===b.dataset.st));
  document.querySelectorAll('#pr [data-pr]').forEach(b=>b.setAttribute('aria-pressed',p.priority===b.dataset.pr));
}

/* ---------- writes: one at a time per document ---------- */
const queue={};
function savePlan(id,patch,isNotes){
  if(!db){toast(t('noDbSave'));return}
  const f=fairs.find(x=>x.id===id)||{};
  const next={...(plans[id]||{}),...patch,fairId:id,series:f.series||null,schemaVersion:2,updatedAt:new Date().toISOString()};
  Object.keys(next).forEach(k=>{if(next[k]===null)delete next[k]});
  plans[id]=next;renderHeader();renderMain();
  queue[id]=(queue[id]||Promise.resolve()).then(()=>db.collection('plans').doc(id).set(next)).then(()=>{
    if(isNotes&&openId===id&&$('#saved'))$('#saved').textContent=t('saved');
  }).catch(e=>{toast(e&&e.code==='invalid_argument'?t('readOnly'):t('saveFail'))});
}

/* ---------- exports (only where the viewer can save files: the local version) ---------- */
let downloads=null;
const icsText=s=>String(s||'').replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/[,;]/g,m=>'\\'+m);
// RFC 5545: lines longer than 75 octets are folded; count UTF-8 bytes so Chinese text is cut correctly
function icsFold(line){
  const enc=new TextEncoder();if(enc.encode(line).length<=75)return line;
  const out=[];let cur='',n=0;
  for(const ch of line){const b=enc.encode(ch).length;if(n+b>(out.length?74:75)){out.push(cur);cur='';n=0}cur+=ch;n+=b}
  out.push(cur);return out.join('\r\n ');
}
function buildIcs(list){
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const out=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Europe Expo Compass//'+lang.toUpperCase(),'CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  list.forEach(f=>{out.push('BEGIN:VEVENT',`UID:${f.id}@expo-compass`,`DTSTAMP:${stamp}`,`DTSTART;VALUE=DATE:${ymd(pd(f.start))}`,`DTEND;VALUE=DATE:${ymd(addDays(pd(f.end),1))}`,
    `SUMMARY:${icsText(L(f,'name'))}`,`LOCATION:${icsText(L(f,'venue')+', '+f.city+', '+COUNTRY[f.country])}`,`DESCRIPTION:${icsText([L(f,'highlight'),t('officialLabel')+f.url].filter(Boolean).join('\n'))}`,`URL:${f.url}`,'TRANSP:TRANSPARENT','END:VEVENT')});
  out.push('END:VCALENDAR');return out.map(icsFold).join('\r\n')+'\r\n';
}
async function saveFile(filename,data,what){
  if(!downloads)return;
  try{await downloads.save({filename,data});toast(t('exported',what))}catch(e){if(!e||e.code!=='declined')toast(t('exportFail'))}
}
$('#ex-go').onclick=()=>{
  const list=fairs.filter(f=>upcoming(f)&&going(plans[f.id])).sort((a,b)=>a.start.localeCompare(b.start));
  if(!list.length)return toast(t('noGoing'));
  saveFile(`expo-compass-going-${iso(today)}.ics`,buildIcs(list),t('calendarN',list.length));
};
$('#ex-list').onclick=()=>{
  const list=fairs.filter(f=>match(f)).sort((a,b)=>a.start.localeCompare(b.start));
  if(!list.length)return toast(t('emptyList'));
  saveFile(`expo-compass-list-${iso(today)}.ics`,buildIcs(list),t('calendarN',list.length));
};
$('#ex-backup').onclick=()=>{
  const backup={format:'expo-compass-backup',schemaVersion:2,exportedAt:new Date().toISOString(),collections:{
    fairs:Object.fromEntries(fairs.map(({id,...d})=>[id,d])),plans,
    settings:{prefs:{highlight:Object.keys(T.zh.IND).filter(k=>HL.has(k)),lang,schemaVersion:1}},meta:meta?{catalog:meta}:{}}};
  saveFile(`expo-compass-backup-${iso(today)}.json`,JSON.stringify(backup,null,1),t('backup'));
};

/* ---------- boot ---------- */
applyStatic();sanitize();renderHeader();renderFilters();renderMain();
(async()=>{
  try{db=await window.claude?.use?.('db')}catch(e){db=null}
  try{downloads=await window.claude?.use?.('downloads')}catch(e){downloads=null}
  $('#exports').hidden=!downloads;
  loaded=true;
  if(!db){renderMain();return}
  db.collection('fairs').onSnapshot(s=>{
    fairs=s.docs.map(d=>({id:d.id,...d.data()}));fairsLoaded=true;
    sanitize();renderHeader();renderFilters();renderMain();
    if(openId&&!fairs.find(f=>f.id===openId))closeDetail();
  },()=>{toast(t('readFail'))});
  db.doc('meta/catalog').onSnapshot(s=>{meta=s.exists?s.data():null;renderHeader()},()=>{});
  db.doc('settings/prefs').onSnapshot(s=>{
    const d=s.exists?s.data():{};
    HL=sanitizeHL(s.exists?d.highlight:null);
    if(LANGS.includes(d.lang)&&d.lang!==lang)setLang(d.lang,false);  // the saved choice wins over the browser default
    renderFilters();renderMain();
  },()=>{});
  db.collection('plans').onSnapshot(s=>{
    const n={};s.docs.forEach(d=>n[d.id]=d.data());
    const ta=$('#notes');const typing=ta&&document.activeElement===ta;
    plans=n;renderHeader();renderMain();
    if(openId){refreshButtons();if(!typing&&ta)ta.value=(plans[openId]||{}).notes||''}
  },()=>{});
})();
</script>
